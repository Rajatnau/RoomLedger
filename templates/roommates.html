{% extends "base.html" %}
{% block title %}Roommates{% endblock %}
{% block content %}

<h1 class="font-semibold text-slate-800 text-lg mb-4">👥 Roommates</h1>

<div class="grid md:grid-cols-3 gap-4">
  {% for p in roommates %}
  {% set rs = roommate_style[p] %}
  <div class="bg-white rounded-xl border border-slate-200 p-5 text-center">
    <span class="h-16 w-16 rounded-full {{ rs.bg }} text-white text-2xl flex items-center justify-center font-bold mx-auto mb-3">{{ rs.initial }}</span>
    <p class="font-semibold text-slate-800">{{ display_name(p) }}</p>
    <p class="text-xs text-slate-500 mt-1">Equal 1/3 share across all expense categories</p>
  </div>
  {% endfor %}
</div>

{% endblock %}
